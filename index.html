<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DoraLP — sua história, seu dorama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f0d13;
    --surface:#1c1824;
    --surface2:#241f2d;
    --line:#332c3d;
    --text:#f5f1ee;
    --muted:#a89bb3;
    --accent:#e8546a;
    --accent2:#f0b429;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;line-height:1.5;}
  .wrap{max-width:640px;margin:0 auto;padding:48px 20px 80px;}
  .brand{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;}
  .brand .mark{font-family:'Fraunces',serif;font-weight:600;font-size:15px;color:var(--accent2);letter-spacing:.02em;}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:34px;margin:0 0 6px;line-height:1.15;}
  .sub{color:var(--muted);font-size:15px;margin:0 0 40px;max-width:46ch;}
  .step{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:16px;}
  .step-num{font-family:'Fraunces',serif;font-style:italic;color:var(--accent);font-size:14px;margin-bottom:6px;}
  .step h2{font-size:17px;margin:0 0 12px;font-weight:600;}
  textarea{width:100%;min-height:110px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:14px;font-family:inherit;font-size:14px;resize:vertical;}
  textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--accent2);outline-offset:2px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  select,.ep-btn{background:var(--surface2);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:10px 14px;font-family:inherit;font-size:14px;cursor:pointer;}
  .ep-btn.active{background:var(--accent);border-color:var(--accent);color:#1a0d10;font-weight:600;}
  .ep-input{width:120px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:10px 14px;font-family:inherit;font-size:15px;}
  .upload{display:flex;align-items:center;gap:14px;border:1px dashed var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;background:var(--surface2);}
  .upload:hover{border-color:var(--accent);}
  .upload #uploadText{color:var(--muted);font-size:14px;}
  .upload #preview{display:none;width:44px;height:44px;border-radius:50%;object-fit:cover;}
  .genbtn{width:100%;margin-top:20px;background:var(--accent);color:#1a0d10;border:none;border-radius:10px;padding:16px;font-family:'Fraunces',serif;font-weight:600;font-size:16px;cursor:pointer;transition:transform .12s ease;}
  .genbtn:hover{transform:translateY(-1px);}
  .genbtn:disabled{opacity:.5;cursor:wait;}
  .hint{color:var(--muted);font-size:12.5px;margin-top:8px;}
  #result{display:none;margin-top:32px;}
  .ep-card{border-left:3px solid var(--accent);background:var(--surface);border-radius:0 12px 12px 0;padding:18px 20px;margin-bottom:12px;}
  .ep-card .tag{font-family:'Fraunces',serif;font-style:italic;color:var(--accent2);font-size:13px;}
  .ep-card h3{margin:4px 0 8px;font-size:16px;}
  .ep-card p{margin:0 0 10px;color:var(--muted);font-size:14px;}
  .play-btn{background:var(--surface2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;}
  .play-btn.playing{border-color:var(--accent);color:var(--accent2);}
  
  /* Sistema de Cenas Imersivas (Casas, Ruas, Personagens) */
  .scene{display:none;width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;margin-top:12px;position:relative;background:#050508;border:1px solid var(--line);}
  .scene-bg{position:absolute;width:100%;height:100%;object-fit:cover;opacity:0.45;animation:kenburns 10s ease-in-out infinite alternate;}
  .scene-overlay{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:flex-end;padding:16px;background:linear-gradient(to top, rgba(15,13,19,0.9), transparent);}
  .scene-avatar{width:54px;height:54px;border-radius:50%;border:2px solid var(--accent2);object-fit:cover;background:#222;}
  .scene-npc{width:54px;height:54px;border-radius:50%;border:2px solid var(--accent);object-fit:cover;background:#333;}
  
  @keyframes kenburns{from{transform:scale(1) translate(0,0);}to{transform:scale(1.12) translate(-2%,-1%);}}
  @media (prefers-reduced-motion:reduce){.scene-bg{animation:none;}}

  .cast{display:flex;gap:10px;margin:14px 0 24px;flex-wrap:wrap;}
  .cast div{background:var(--surface2);border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:13px;}
  .cast b{color:var(--accent2);}
  .note{border:1px dashed var(--line);border-radius:10px;padding:14px 16px;color:var(--muted);font-size:13px;margin-top:28px;}
  .tabs{display:flex;gap:6px;margin-bottom:28px;border-bottom:1px solid var(--line);}
  .tab{background:none;border:none;color:var(--muted);padding:10px 4px;margin-right:18px;font-family:inherit;font-size:14px;cursor:pointer;border-bottom:2px solid transparent;}
  .tab.active{color:var(--text);border-color:var(--accent);}
  .view{display:none;}
  .view.active{display:block;}
  .lib-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;}
  .lib-card:hover{border-color:var(--accent);}
  .lib-card h3{margin:0 0 4px;font-size:15px;}
  .lib-card p{margin:0;color:var(--muted);font-size:12.5px;}
  .lib-empty{color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:10px;padding:28px;text-align:center;}
  .del{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px 8px;}
  .del:hover{color:var(--accent);}
  .cfg-row{margin-bottom:12px;}
  .cfg-row label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;}
  .cfg-row input{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:10px 12px;font-family:inherit;font-size:13px;}
  .savebtn{background:var(--surface2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px 16px;font-size:13px;cursor:pointer;margin-top:4px;}
  .status{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;}
  .status.on{background:#4ade80;}
  .dlbtn{width:100%;background:var(--surface2);border:1px solid var(--accent);color:var(--accent2);border-radius:10px;padding:14px;font-family:'Fraunces',serif;font-weight:600;font-size:15px;cursor:pointer;margin-top:18px;}
  .dlbtn:hover{background:var(--surface);}
  .dialog{margin:8px 0 12px;}
  .line{margin:4px 0;font-size:13.5px;color:var(--text);}
  .line b{color:var(--accent2);}
  .line.speaking{color:var(--accent2);font-weight:600;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="mark">LP</span></div>
  <h1>DoraLP</h1>
  <p class="sub">Conta a tua história. Elenco completo, NPCs dinâmicos, cenários e voz sincronizada.</p>

  <div class="tabs">
    <button class="tab active" data-view="lib">Biblioteca</button>
    <button class="tab" data-view="create">Criar</button>
    <button class="tab" data-view="cfg">Configuração</button>
  </div>

  <div class="view active" id="view-lib">
    <div id="libList"></div>
  </div>

  <div class="view" id="view-create">
    <div class="step">
      <div class="step-num">01</div>
      <h2>A tua história (ex: Laiton Flugêncio)</h2>
      <textarea id="story" placeholder="Ex: Na minha vida passada fui traído... Agora com o Sistema de Evolução do Vilão, Laiton Flugêncio vai dominar a seita e o mundo..."></textarea>
    </div>

    <div class="step">
      <div class="step-num">02</div>
      <h2>O protagonista és tu</h2>
      <p class="hint" style="margin:0 0 12px;">Escolhe a tua foto para aparecer nas cenas de combate e diálogo.</p>
      <label class="upload" id="uploadBox">
        <input type="file" id="photoInput" accept="image/*" hidden>
        <span id="uploadText">Escolher foto da galeria</span>
        <img id="preview" alt="">
      </label>
    </div>

    <div class="step">
      <div class="step-num">03</div>
      <h2>Quantos episódios?</h2>
      <input type="number" id="epInput" min="1" value="8" class="ep-input">
    </div>

    <div class="step">
      <div class="step-num">04</div>
      <h2>Voz Principal</h2>
      <select id="voiceSelect"></select>
    </div>

    <button class="genbtn" id="genBtn">Gerar dorama completo</button>

    <div id="result"></div>
  </div>

  <div class="view" id="view-cfg">
    <div class="step">
      <div class="step-num"><span class="status" id="cfgStatus"></span></div>
      <h2>Ligação ao Supabase & IA</h2>
      <div class="cfg-row">
        <label>Supabase URL</label>
        <input id="cfgUrl" placeholder="https://xxxx.supabase.co">
      </div>
      <div class="cfg-row">
        <label>Supabase Anon Key</label>
        <input id="cfgKey" placeholder="eyJhbGciOi...">
      </div>
      <button class="savebtn" id="cfgSave">Guardar Configuração</button>
    </div>
  </div>
</div>

<script>
const voiceSelect = document.getElementById('voiceSelect');

// Abas
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('view-'+t.dataset.view).classList.add('active');
    if(t.dataset.view==='lib') renderLibrary();
  });
});

// Supabase Config local storage
const cfgUrl = document.getElementById('cfgUrl');
const cfgKey = document.getElementById('cfgKey');
const cfgStatus = document.getElementById('cfgStatus');
function loadCfg(){
  cfgUrl.value = localStorage.getItem('doralp_supabase_url') || 'https://xrszwvunkwvqfwhcbkis.supabase.co';
  cfgKey.value = localStorage.getItem('doralp_supabase_key') || 'sb_publishable_X-bTkv4bEKXwgbKF1LohLw_vuTFCT8I';
  cfgStatus.classList.toggle('on', !!(cfgUrl.value && cfgKey.value));
}
document.getElementById('cfgSave').addEventListener('click', ()=>{
  localStorage.setItem('doralp_supabase_url', cfgUrl.value.trim());
  localStorage.setItem('doralp_supabase_key', cfgKey.value.trim());
  loadCfg();
  alert('Configurações salvas com sucesso!');
});
loadCfg();

// Biblioteca
function getLibrary(){
  try{ return JSON.parse(localStorage.getItem('doralp_library') || '[]'); }catch(e){ return []; }
}
function saveToLibrary(item){
  const lib = getLibrary();
  lib.unshift(item);
  localStorage.setItem('doralp_library', JSON.stringify(lib));
}
function renderLibrary(){
  const lib = getLibrary();
  const el = document.getElementById('libList');
  if(!lib.length){
    el.innerHTML = '<div class="lib-empty">Ainda não criaste nenhum dorama. Vai à aba Criar para começar a tua saga.</div>';
    return;
  }
  el.innerHTML = lib.map((d,i)=>`
    <div class="lib-card">
      <div><h3>${d.title}</h3><p>${d.episodes} episódios · Género: ${d.genre}</p></div>
      <button class="del" data-i="${i}">×</button>
    </div>
  `).join('');
  el.querySelectorAll('.del').forEach(b=>{
    b.addEventListener('click', e=>{
      e.stopPropagation();
      const lib = getLibrary();
      lib.splice(+b.dataset.i,1);
      localStorage.setItem('doralp_library', JSON.stringify(lib));
      renderLibrary();
    });
  });
}
renderLibrary();

// Vozes do navegador
const hasVoice = typeof speechSynthesis !== 'undefined';
function loadVoices(){
  if(!hasVoice){ voiceSelect.innerHTML = '<option>Voz não suportada</option>'; return; }
  const voices = speechSynthesis.getVoices();
  const pt = voices.filter(v=>v.lang.startsWith('pt'));
  const list = pt.length ? pt : voices;
  voiceSelect.innerHTML = list.map(v=>`<option value="${v.name}">${v.name} (${v.lang})</option>`).join('') || '<option>Sem vozes pt</option>';
}
loadVoices();
if(hasVoice && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;

const epInput = document.getElementById('epInput');
const photoInput = document.getElementById('photoInput');
const preview = document.getElementById('preview');
const uploadText = document.getElementById('uploadText');
let protagonistPhoto = null;

document.getElementById('uploadBox').addEventListener('click', e=>{ if(e.target!==photoInput) photoInput.click(); });
photoInput.addEventListener('change', ()=>{
  const file = photoInput.files[0];
  if(!file) return;
  protagonistPhoto = URL.createObjectURL(file);
  preview.src = protagonistPhoto;
  preview.style.display = 'block';
  uploadText.textContent = 'Foto selecionada — trocar';
});

// Banco de cenários visuais automáticos baseados em ambiente de dorama (Ruas, Casas, Templos, Seitas)
const backgrounds = [
  'https://images.unsplash.com/photo-1578632767115-351597cf2477?w=800&auto=format&fit=crop&q=60', // Templo / Seita antiga
  'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=800&auto=format&fit=crop&q=60', // Rua noturna com luzes de néon / cidade fantástica
  'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=800&auto=format&fit=crop&q=60', // Floresta mística / cultivo
  'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=800&auto=format&fit=crop&q=60'  // Mansão / casa interna de luxo
];

const genres = [
  {key:'cultivo', words:['cultivador','cultivo','imortal','seita','qi','espada','dao','laiton'], npcs:['Mestre Yao','Chen Wuji','Irmã Lin Xue','Sistema [Nível Max]'], titles:['O Despertar da Seita','A Técnica Proibida','O Julgamento dos Imortais','Ascensão Suprema']},
  {key:'sistema', words:['sistema','level','ranking','dungeon','status','xp','painel'], npcs:['[Painel do Sistema]','Guilda Sombria','Rival Kang'], titles:['Ativação de Status','Missão de Sobrevivência','Quebrando os Limites','O Chefe Oculto']},
  {key:'default', words:[], npcs:['Aliado Misterioso','Rival de Clã','Ancião da Seita'], titles:['O Primeiro Passo','Confronto nas Sombras','Ponto de Virada','A Vingança']}
];

function pickGenre(text){
  const t = text.toLowerCase();
  for(const g of genres){ if(g.words.some(w=>t.includes(w))) return g; }
  return genres[genres.length-1];
}

function buildEpisode(n, genre, story, total){
  const title = genre.titles[n % genre.titles.length] + (n>=genre.titles.length ? ` — Parte ${Math.floor(n/genre.titles.length)+1}` : '');
  const villain = genre.npcs[1] || 'Rival';
  const ally = genre.npcs[0] || 'Aliado';
  let desc, lines;

  if(n === 0){
    desc = 'Abertura: O protagonista desperta num mundo impiedoso onde todos o subestimavam.';
    lines = [
      {who: 'Laiton Flugêncio', text: 'Eles pensaram que podiam descartar-me. O meu sistema vai provar o contrário.'},
      {who: ally, text: 'Tem cuidado, Laiton. Os anciões da seita estão de olho em ti.'}
    ];
  } else if(n === total - 1){
    desc = 'Episódio Final: O confronto supremo contra os falsos mestres e rivais.';
    lines = [
      {who: villain, text: 'Ainda pensas que podes vencer-me e tomar o controle?'},
      {who: 'Laiton Flugêncio', text: 'A minha evolução está completa. Isto acaba aqui e agora.'}
    ];
  } else {
    desc = 'Desenvolvimento de poder, missões secretas e tensão crescente entre as facções.';
    lines = [
      {who: 'Laiton Flugêncio', text: 'Ganhei mais 500 pontos de XP. O próximo nível está perto.'},
      {who: villain, text: 'Como ele conseguiu ficar tão forte tão rápido?! Isso é impossível!'}
    ];
  }
  return { n: n+1, title, desc, lines, bg: backgrounds[n % backgrounds.length] };
}

// Geração do Dorama
document.getElementById('genBtn').addEventListener('click', ()=>{
  const story = document.getElementById('story').value.trim();
  const episodes = Math.max(1, +epInput.value || 8);
  const btn = document.getElementById('genBtn');
  const result = document.getElementById('result');
  if(!story){ document.getElementById('story').focus(); return; }

  btn.disabled = true; btn.textContent = 'A IA está a estruturar o elenco e cenários...';

  setTimeout(()=>{
    const genre = pickGenre(story);
    const eps = Array.from({length: episodes}, (_,i)=> buildEpisode(i, genre, story, episodes));

    let html = `<div class="cast">` +
      `<div><b>Protagonista</b> · Laiton Flugêncio</div>` +
      genre.npcs.map(n=>`<div><b>NPC</b> · ${n}</div>`).join('') +
      `</div>`;

    html += eps.map((e,idx)=>`
      <div class="ep-card">
        <div class="tag">Episódio ${e.n}</div>
        <h3>${e.title}</h3>
        <p>${e.desc}</p>
        <div class="dialog">${e.lines.map(l=>`<p class="line"><b>${l.who}:</b>${l.text}</p>`).join('')}</div>
        <button class="play-btn" data-idx="${idx}">▶ Assistir Cena (Dorama)</button>
        <div class="scene" id="scene-${idx}">
          <img class="scene-bg" src="${e.bg}" alt="Cenário">
          <div class="scene-overlay">
            <img class="scene-avatar" src="${protagonistPhoto || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100'}" alt="Laiton">
            <div style="color:#fff; font-size:12px; text-align:center; font-family:'Fraunces',serif; text-shadow:0 2px 4px #000;" id="status-txt-${idx}">Pronto para reproduzir</div>
            <img class="scene-npc" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100" alt="NPC">
          </div>
        </div>
      </div>
    `).join('');

    html += `<button class="dlbtn" id="downloadBtn">⬇ Baixar Roteiro Completo (.txt)</button>`;

    result.innerHTML = html;
    result.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Gerar Novamente';
    result.scrollIntoView({behavior:'smooth', block:'start'});

    // Download
    document.getElementById('downloadBtn').addEventListener('click', ()=>{
      let txt = `DORAMA: ${story}\nGénero: ${genre.key} · ${episodes} episódios\n\n`;
      eps.forEach(e=>{
        txt += `EPISÓDIO ${e.n}: ${e.title}\n${e.desc}\n`;
        e.lines.forEach(l=> txt += `  ${l.who}: ${l.text}\n`);
        txt += '\n';
      });
      const blob = new Blob([txt], {type:'text/plain;charset=utf-8'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'Laiton_Flugencio_Dorama.txt';
      a.click();
    });

    saveToLibrary({
      title: story.length>40 ? story.slice(0,40)+'…' : story,
      episodes: episodes,
      genre: genre.key,
      created: Date.now()
    });

    // Reprodução de Voz e Animação de Cenas
    result.querySelectorAll('.play-btn').forEach(pb=>{
      pb.addEventListener('click', ()=>{
        const idx = +pb.dataset.idx;
        const e = eps[idx];
        const sceneEl = document.getElementById('scene-'+idx);
        const statusTxt = document.getElementById('status-txt-'+idx);
        const lineEls = pb.previousElementSibling.querySelectorAll('.line');

        sceneEl.style.display = 'block';
        if(!hasVoice){ return; }

        speechSynthesis.cancel();
        const voices = speechSynthesis.getVoices();
        const chosen = voices.find(v=>v.name===voiceSelect.value);
        pb.classList.add('playing'); pb.textContent = '❚❚ A reproduzir dorama...';

        let i = 0;
        function speakNext(){
          lineEls.forEach(el=>el.classList.remove('speaking'));
          if(i >= e.lines.length){
            pb.classList.remove('playing'); pb.textContent = '▶ Assistir Cena (Dorama)';
            statusTxt.textContent = 'Episódio concluído';
            return;
          }
          const line = e.lines[i];
          lineEls[i].classList.add('speaking');
          statusTxt.textContent = `${line.who} a falar...`;

          const utter = new SpeechSynthesisUtterance(line.text);
          if(chosen) utter.voice = chosen;
          utter.lang = chosen ? chosen.lang : 'pt-PT';
          utter.pitch = line.who.includes('Laiton') ? 0.9 : 1.2;
          utter.rate = 1.0;

          utter.onend = utter.onerror = ()=>{ i++; speakNext(); };
          speechSynthesis.speak(utter);
        }
        speakNext();
      });
    });
  }, 1200);
});
</script>
</body>
</html>
